workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.example.quranapp"
    scripts:
      - name: Initialize Gradle
        script: |
          cd $CM_BUILD_DIR
          gradle init --type basic --script-style kotlin || true
          gradle wrapper
          chmod +x gradlew
      - name: Build Android APK
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
